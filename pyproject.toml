[project]
name = "deins-affiliate-pipeline"
version = "0.1.0"
description = "Telegram -> AI captions -> YouTube/Facebook/Threads affiliate video pipeline"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic-settings>=2.4",
    "openai>=1.40",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
